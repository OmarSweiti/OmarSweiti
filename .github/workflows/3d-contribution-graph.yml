name: 3D contribution graph

on:
  schedule:
    # 00:37 in Amman (UTC+3), away from the top of the hour when scheduled runs queue up.
    - cron: "37 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/3d-contribution-graph.yml
      - .github/3d-contrib/**
  # Builds without publishing, so dependency updates are checked before they merge.
  pull_request:
    paths:
      - .github/workflows/3d-contribution-graph.yml
      - .github/3d-contrib/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: the third-party generator never sees a token that can write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib/settings.json

      - name: Remove language donut and star/fork counters
        run: python3 .github/3d-contrib/trim.py profile-3d-contrib/*.svg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 3d-contrib
          path: profile-3d-contrib/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to output branch
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 3d-contrib
          path: ${{ runner.temp }}/3d-contrib

      # A single force-pushed commit keeps generated images out of main's history.
      - name: Push SVGs to the output branch
        run: |
          git switch --orphan output
          cp "$RUNNER_TEMP"/3d-contrib/*.svg .
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Regenerate 3D contribution graph"
          git push --force origin output
